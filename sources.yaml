# Источники новостей.
#   id       — уникальный идентификатор источника (не менять после запуска: по нему хранятся новости)
#   type     — тип источника: rss
#   only_genres — (rss) жанр или список: только записи с таким <yandex:genre> (message — новости, article — статьи)
#   interval — период опроса в секундах (по умолчанию POLL_INTERVAL)
#   enabled  — false, чтобы отключить (так же добавляются кандидаты: сервис их не опрашивает,
#              а scripts/preview_source.py проверяет)
#   skip_urls — регулярное выражение или список: новости с такими ссылками не сохраняются
#   only_categories — рубрика или список: сохраняются только новости, у которых в ленте есть одна из них
#                     (регистр не важен)
#   skip_categories — рубрика или список: новости, у которых в ленте есть одна из них, не сохраняются
#   content  — как получить полный текст:
#     strategy: from_source            — текст уже есть в ленте (content:encoded)
#     strategy: css, selector: "..."   — скачать страницу и взять блок по CSS-селектору
#   Очистка полученного HTML (для любой стратегии):
#     exclude: [селекторы]             — удалить элементы по CSS-селекторам
#     drop_link_only: true             — удалить абзацы, состоящие только из ссылок
#     drop_text: [регулярки]           — удалить абзацы, в тексте которых найдено выражение («^» — начало абзаца)
#     drop_before: {target, text_in}   — удалить блоки подряд перед target, весь текст которых внутри text_in
#   categories — рубрики со страницы новости (добавляются к категориям из ленты; +1 запрос на новость):
#     selector: "..."                  — CSS-селектор или список; значение — атрибут content (у <meta>) или текст

- id: meduza
  type: rss
  url: https://meduza.io/rss/all
  # Лонгриды и карточки не нужны — только новости.
  skip_urls:
    - ^https://meduza\.io/feature/
    - ^https://meduza\.io/slides/
  content:
    strategy: from_source
    # Встраивания соцсетей: без их скрипта в текст попадает запасной текст поста.
    exclude:
      - blockquote.twitter-tweet
      - blockquote.instagram-media
      - blockquote.tiktok-embed
      # Подписи к картинкам — не текст статьи.
      - figcaption
      # Блоки связанных материалов: заголовок h4 («Читайте также» и т.п.) и сразу за ним список ссылок.
      - "h4:has(+ ul)"
      - "h4 + ul"

- id: sports_ru
  type: rss
  url: https://www.sports.ru/rss/all_news.xml
  # В ленте всего 20 записей, а публикуют 30–50 в час — при опросе раз в час новости теряются.
  interval: 600
  content:
    strategy: css
    selector: .news-content__structured-body-wrapper
    # В тело статьи вставлены абзацы-ссылки: «читайте также», календари, реклама.
    drop_link_only: true
    # Виджеты матчей (счёт, xG, хронология, составы) — не текст статьи.
    exclude: '[type$="-match"]'
    # Жирные подзаголовки перед виджетами: «Лига наций», «Групповой этап», «4-й тур».
    drop_before:
      target: '[type$="-match"]'
      text_in: .sb-text--bold

- id: ixbt
  type: rss
  url: https://www.ixbt.com/export/news.rss
  # В ленте рубрик нет — берём со страницы.
  categories:
    selector: 'meta[property="article:section"]'
  content:
    strategy: from_source
    # Подписи к картинкам — почти всегда «Источник изображения: …».
    exclude: figcaption
    # Сноски-дисклеймеры про Meta: «* Деятельность организации… признана экстремистской…»,
    # «Meta Platforms*, а также принадлежащие ей продукты…», «** запрещены в России».
    drop_text: '^(\*+|Meta Platforms\*).*(запрещен|экстремист|нежелательн)'

- id: habr
  type: rss
  url: https://habr.com/ru/rss/news/
  content:
    strategy: css
    selector: "#post-content-body"
    # Подписи к картинкам — не текст статьи.
    exclude: figcaption
    # Сноски-дисклеймеры про Meta: «* Деятельность организации… признана экстремистской…»,
    # «Meta Platforms*, а также принадлежащие ей продукты…», «** запрещены в России».
    drop_text: '^(\*+|Meta Platforms\*).*(запрещен|экстремист|нежелательн)'

- id: snob
  type: rss
  url: https://snob.ru/rss/
  # Только новости: у статей (культура, кино, «Сделано в России» и т.п.) другие рубрики.
  only_categories: Новости
  content:
    strategy: from_source

- id: knife
  type: rss
  url: https://knife.media/feed/
  # Только новости: у статей рубрика «Статьи».
  only_categories: Новости
  content:
    strategy: from_source
    exclude:
      # Подписи к картинкам — не текст статьи.
      - figcaption
      # Концовка «Читайте больше актуальных новостей тут» (ссылка — только «тут»).
      - 'p:-soup-contains("Читайте больше актуальных новостей")'

- id: bumaga
  type: rss
  url: https://paperpaper.io/feed/
  # Только новости: у статей (истории, гиды) и у грузинской редакции Paper Kartuli другие рубрики.
  only_categories: Новости
  content:
    strategy: from_source
    # Концовка-реклама соцсетей: «💚 Подпишитесь на наш инстаграм…», «💚 Больше любопытного… в телеграм-канале».
    exclude: 'p:-soup-contains("💚")'
    # Подписи к фото — обычные абзацы «Фото: …», «Скриншот: …» и т.п.
    # (🔗 в конце для отбора не годится: он бывает и в настоящих абзацах).
    drop_text: '^(Фото|Скриншот|Иллюстраци[яи]|Видео|Афиша): '

- id: verstka
  type: rss
  url: https://verstka.media/feed
  # Только новости: у статей рубрика «Тексты».
  only_categories: Новости
  content:
    strategy: from_source
    drop_text:
      # Подвал WordPress: «The post … first appeared on Вёрстка.»
      - '^The post .* first appeared on '
      # Подпись к фото в конце текста.
      - '^Фото: '

- id: frank_media
  type: rss
  url: https://frankmedia.ru/feed
  # Рубрики «Новости» нет; справочные статьи («Как установить…», «Что такое…») — в рубрике «Ликбез».
  skip_categories: Ликбез
  content:
    strategy: from_source
    # Подписи к картинкам: источник фото или пояснения к скриншотам.
    exclude: figcaption
    drop_text:
      # Подвал WordPress: «Сообщение … появилось сначала на Frank Media.»
      - '^Сообщение .* появилось сначала на Frank Media'
      # Источник фото в конце текста: «Фото на обложке: … / Shutterstock», «Фото: Unsplash».
      - '^Фото( на обложке)?:'

- id: indicator
  type: rss
  url: https://indicator.ru/exports/rss
  # Рубрики тематические; тип материала — в <yandex:genre>: message — новости, article — статьи и интервью.
  only_genres: message
  content:
    strategy: from_source
    # Подписи к картинкам с источником (span.copyright) — не текст статьи.
    exclude: figcaption
    # Подпись автора в конце: «Текст: Альфия Тимошенко».
    drop_text: '^Текст: '
