services:
  postgres:
    # Postgres 17 с расширением pgvector.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-news}
    ports:
      # Только localhost: снаружи доступ через SSH-туннель.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  parser:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-news}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-news}
      POLL_INTERVAL: ${POLL_INTERVAL:-3600}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-30}
      HTTP_MAX_ATTEMPTS: ${HTTP_MAX_ATTEMPTS:-5}
      HTTP_BACKOFF_BASE: ${HTTP_BACKOFF_BASE:-1}
      HTTP_BACKOFF_MAX: ${HTTP_BACKOFF_MAX:-30}
      REQUEST_DELAY: ${REQUEST_DELAY:-1}
      CONTENT_MAX_CYCLES: ${CONTENT_MAX_CYCLES:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Список источников можно менять без пересборки образа (нужен только перезапуск).
      - ./sources.yaml:/app/sources.yaml:ro
    stop_grace_period: 30s

volumes:
  postgres-data:
