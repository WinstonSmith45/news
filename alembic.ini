# Миграции схемы БД (Alembic). Пишутся вручную на SQL через op.execute, без ORM.
# Адрес базы берётся из DATABASE_URL, как у парсера.
#
#   alembic upgrade head                           — применить все миграции
#   alembic upgrade head --sql                     — показать SQL, не подключаясь к базе
#   alembic downgrade -1                           — откатить последнюю
#   alembic revision --rev-id 0002 -m "add lang"   — новая миграция (номер по порядку)
#
# Парсер сам применяет миграции при старте (news_parser/migrate.py).

[alembic]
script_location = news_parser:migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
